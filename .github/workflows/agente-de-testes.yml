# Roda o agente de testes a cada push e pull request.
# Usa um Postgres descartável do próprio GitHub (nunca o banco de produção).
name: Agente de testes

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: estudaai_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Interface (navegador)
        run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - name: Agente de testes
        run: npm run test:agent
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/estudaai_test
